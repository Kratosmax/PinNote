name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag and build signed assets
        shell: pwsh
        env:
          PINNOTE_UPDATE_SIGNING_KEY: ${{ secrets.PINNOTE_UPDATE_SIGNING_KEY }}
        run: |
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "标签 $env:GITHUB_REF_NAME 与项目版本 $version 不一致。"
          }
          if ([string]::IsNullOrWhiteSpace($env:PINNOTE_UPDATE_SIGNING_KEY)) {
            throw "缺少 PINNOTE_UPDATE_SIGNING_KEY。"
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "pinnote-update-private.pem"
          try {
            [IO.File]::WriteAllText($keyPath, $env:PINNOTE_UPDATE_SIGNING_KEY)
            ./scripts/Build-Release.ps1 -PrivateKeyPath $keyPath
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $root = "temp/release/v$version"
          gh release create "v$version" `
            "$root/PinNote-$version-portable-win-x64.zip" `
            "$root/update.json" `
            "$root/SHA256SUMS.txt" `
            --title "PinNote $version" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
